# ==============================
# Server Configuration
# ==============================
spring.application.name=afiapass-api-gateway
server.port=${PORT:8080}

# ==============================
# Database Configuration (MySQL)
# ==============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/afiapass_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# ==============================
# JPA / Hibernate Configuration
# ==============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Use 'update' so Spring creates your PermitRecord table automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# AfiaPass Security (JWT)
# ==============================
security.jwt.secret=${JWT_SECRET_KEY}
security.jwt.expiration-ms=3600000

# ==============================
# Stellar / Soroban Blockchain Config
# ==============================
afiapass.stellar.network=${AFIAPASS_NETWORK:TESTNET}
afiapass.stellar.rpc-url=${AFIAPASS_RPC_URL:https://soroban-testnet.stellar.org}
afiapass.stellar.platform-secret=${AFIAPASS_PLATFORM_SECRET}
afiapass.stellar.contract-id=${AFIAPASS_CONTRACT_ID}

spring.config.import=optional:secrets.properties